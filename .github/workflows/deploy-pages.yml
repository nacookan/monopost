name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
        run: |
          test -n "$DROPBOX_APP_KEY"
          mkdir _site
          cp index.html privacy.html app.js styles.css manifest.webmanifest sw.js favicon.ico _site/
          cp -R assets _site/assets
          printf 'window.MONOPOST_CONFIG = { dropboxAppKey: "%s" };\n' "$DROPBOX_APP_KEY" > _site/config.local.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
